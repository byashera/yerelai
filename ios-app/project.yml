name: SENAI
options:
  bundleIdPrefix: com.senai
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: "NO"
    ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: "AccentColor"

targets:
  SENAI:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SENAI
        excludes:
          - "**/*.md"
    info:
      path: SENAI/Info.plist
      properties:
        CFBundleDisplayName: "SEN.AI"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: "SEN.AI ev Wi-Fi ağındaki bilgisayarınıza hızlı bağlanmak için yerel ağ izni kullanır."
        NSMicrophoneUsageDescription: "SEN.AI sesli mesaj göndermek için mikrofonunuzu kullanır."
        NSSpeechRecognitionUsageDescription: "SEN.AI Türkçe sesli komutlarınızı metne çevirmek için konuşma tanıma izni kullanır."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.senai.app
        PRODUCT_NAME: SENAI
        INFOPLIST_FILE: SENAI/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
