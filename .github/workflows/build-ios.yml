name: Build SEN.AI iOS (.ipa & Simulator)

on:
  workflow_dispatch:
  push:
    paths:
      - "ios-app/**"
      - ".github/workflows/build-ios.yml"

jobs:
  build-ios:
    name: Build SEN-AI.ipa, Appetize Simulator & Screenshots
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode & Swift version
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios-app
        run: xcodegen generate

      - name: Build SENAI.app for iPhone (Release, unsigned .ipa)
        working-directory: ios-app
        run: |
          xcodebuild \
            -project SENAI.xcodeproj \
            -scheme SENAI \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package SEN-AI.ipa
        working-directory: ios-app
        run: |
          mkdir -p dist/Payload
          cp -R build-device/Build/Products/Release-iphoneos/SENAI.app dist/Payload/
          cd dist
          zip -qry SEN-AI.ipa Payload
          ls -lh SEN-AI.ipa

      - name: Build SENAI.app for iOS Simulator (Appetize.io & Screenshots)
        working-directory: ios-app
        run: |
          xcodebuild \
            -project SENAI.xcodeproj \
            -scheme SENAI \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO \
            clean build
          mkdir -p dist-sim
          OUT_ZIP="$PWD/dist-sim/SEN-AI-Simulator.app.zip"
          (cd build-sim/Build/Products/Release-iphonesimulator && zip -qry "$OUT_ZIP" SENAI.app)
          ls -lh "$OUT_ZIP"

      - name: Capture Multi-Screen & Live Tunnel iPhone Simulator Screenshots
        working-directory: ios-app
        continue-on-error: true
        env:
          SENAI_PIN: ${{ secrets.SENAI_PIN }}
        run: |
          mkdir -p dist-shots
          UDID=$(xcrun simctl list devices available | grep -E "iPhone 16 Pro|iPhone 16|iPhone 15" | head -n 1 | sed -E 's/.*\(([0-9A-F-]+)\).*/\1/')
          echo "Using Simulator UDID: $UDID"
          if [ -n "$UDID" ]; then
            xcrun simctl boot "$UDID" || true
            xcrun simctl bootstatus "$UDID" -b
            xcrun simctl install "$UDID" build-sim/Build/Products/Release-iphonesimulator/SENAI.app

            # 1 & 2: Flagship 2x2 Bento Welcome (Light & Dark)
            xcrun simctl ui "$UDID" appearance light
            xcrun simctl launch "$UDID" com.senai.app --preview-screen welcome
            sleep 3
            xcrun simctl io "$UDID" screenshot dist-shots/01-welcome-light.png
            xcrun simctl ui "$UDID" appearance dark
            sleep 2
            xcrun simctl io "$UDID" screenshot dist-shots/02-welcome-dark.png

            # 3 & 4: Rich Chat Screen with Weather + Compatibility Ring + Sources Pill (Light & Dark)
            xcrun simctl terminate "$UDID" com.senai.app || true
            xcrun simctl ui "$UDID" appearance light
            xcrun simctl launch "$UDID" com.senai.app --preview-screen chat
            sleep 3
            xcrun simctl io "$UDID" screenshot dist-shots/03-chat-cards-light.png
            xcrun simctl ui "$UDID" appearance dark
            sleep 2
            xcrun simctl io "$UDID" screenshot dist-shots/04-chat-cards-dark.png

            # 5: History Sidebar Sheet (Dark)
            xcrun simctl terminate "$UDID" com.senai.app || true
            xcrun simctl launch "$UDID" com.senai.app --preview-screen sidebar
            sleep 3
            xcrun simctl io "$UDID" screenshot dist-shots/05-sidebar-dark.png

            # 6: Native iOS Settings Form (Light)
            xcrun simctl terminate "$UDID" com.senai.app || true
            xcrun simctl ui "$UDID" appearance light
            xcrun simctl launch "$UDID" com.senai.app --preview-screen settings
            sleep 3
            xcrun simctl io "$UDID" screenshot dist-shots/06-settings-light.png

            # 7: Real LIVE Tunnel Chat Test (if SENAI_PIN secret is set)
            if [ -n "$SENAI_PIN" ]; then
              xcrun simctl terminate "$UDID" com.senai.app || true
              xcrun simctl ui "$UDID" appearance dark
              xcrun simctl launch "$UDID" com.senai.app --auto-pin "$SENAI_PIN" --auto-prompt "Manisa hava durumu nasıl?"
              sleep 16
              xcrun simctl io "$UDID" screenshot dist-shots/07-live-tunnel-chat-dark.png
            fi

            xcrun simctl shutdown "$UDID" || true
            ls -lh dist-shots
          fi

      - name: Upload SEN-AI.ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: SEN-AI-iOS-IPA
          path: ios-app/dist/SEN-AI.ipa
          retention-days: 30

      - name: Upload Appetize.io Simulator App (.app.zip)
        uses: actions/upload-artifact@v4
        with:
          name: SEN-AI-Simulator-App
          path: ios-app/dist-sim/SEN-AI-Simulator.app.zip
          retention-days: 30

      - name: Upload iPhone Simulator Screenshots (Light & Dark)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SEN-AI-Simulator-Screenshots
          path: ios-app/dist-shots/*.png
          if-no-files-found: ignore
          retention-days: 30
