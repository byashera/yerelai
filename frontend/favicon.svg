  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgObs)"/>
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="15.25" stroke="url(#rim)" stroke-width="1.5"/>
  <circle cx="32" cy="31" r="23" fill="url(#aura)"/>
  <!-- Multi-faceted Aether Prism -->
  <polygon points="32,10 15,35 32,41" fill="url(#fLeft)"/>
  <polygon points="32,10 49,35 32,41" fill="url(#fRight)"/>
  <polygon points="15,35 32,54 32,41" fill="url(#fBotL)"/>
  <polygon points="49,35 32,54 32,41" fill="url(#fBotR)"/>
  <!-- Inner specular core & highlight -->
  <polygon points="32,10 24,33 32,41" fill="#ffffff" fill-opacity="0.24"/>
  <polygon points="32,20 39,34 32,40 25,34" fill="#ffffff" fill-opacity="0.26"/>
  <polygon points="32,10 49,35 32,54 15,35" stroke="#ffffff" stroke-opacity="0.48" stroke-width="1.1" stroke-linejoin="round"/>
  <circle cx="44" cy="18" r="1.7" fill="#e0f2fe" fill-opacity="0.9"/>
